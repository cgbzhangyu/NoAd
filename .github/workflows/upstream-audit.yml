name: Upstream audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit source availability and hashes
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/noad.py audit-sources --output source-audit.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open one actionable audit issue
        if: steps.audit.outputs.exit_code != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          title="[上游审计] 公开规则源变化或不可用"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body "定期审计返回代码 $AUDIT_CODE。请下载本次 workflow 的 source-audit artifact，人工检查许可证、规则差异和误杀风险。此工作流不会自动覆盖稳定版。"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit
          path: source-audit.json
          if-no-files-found: error


