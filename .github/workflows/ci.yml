name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate catalogs
        run: python scripts/noad.py validate
      - name: Check generated modules
        run: python scripts/noad.py build --check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Confirm generated files are committed
        run: git diff --exit-code

