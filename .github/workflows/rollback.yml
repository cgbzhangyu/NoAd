name: Roll back stable artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing reviewed tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore reviewed artifacts as a new stable commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git fetch origin stable:stable --tags
          git switch stable
          git checkout "$RELEASE_TAG" -- dist/stable dist/status.json dist/SHA256SUMS README.md LICENSE CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/stable dist/status.json dist/SHA256SUMS README.md LICENSE CHANGELOG.md
          git commit -m "rollback: restore $RELEASE_TAG artifacts"
          git push origin stable

